# O pacote do Slackware -current, à parte dos outros: o Slackware não tem o WebKitGTK, e
# o motor é compilado aqui (umas duas horas na primeira vez de cada versão; depois vem do
# cache). A cada tag v* (e à mão, com a tag), o pacote entra na release daquela versão
# quando fica pronto, sem segurar os outros pacotes.
name: Slackware

on:
  push:
    tags: ["v*"]
    # Uma correção na receita do Slackware refaz o pacote da versão atual (a do Cargo.toml).
    branches: [master]
    paths: ["ci/motor-slackware.sh", "ci/slackware.sh", "empacotar-slackware.sh", ".github/workflows/slackware.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A release (tag) que recebe o pacote"
        required: true

permissions:
  contents: write

jobs:
  slackware:
    name: slackware (-current)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: A release que recebe o pacote
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then t="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = tag ]; then t="${{ github.ref_name }}"
          else t=""; fi
          echo "TAG=$t" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # O motor compilado fica guardado (só se compila de novo quando a versão do WebKitGTK
      # em ci/motor-slackware.sh muda).
      - name: Cache do motor
        id: motor
        uses: actions/cache/restore@v4
        with:
          path: motor-slackware
          key: motor-slackware-${{ hashFiles('ci/motor-slackware.sh') }}

      - name: Liberar espaço (o motor ocupa uns 20 GB compilando)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Compilar, empacotar e conferir (Slackware -current)
        run: docker run --rm -v "$PWD:/src" -w /src aclemons/slackware:current sh ci/slackware.sh

      # O motor leva horas para compilar: fica guardado assim que existe, mesmo que um passo
      # de depois falhe (antes, uma falha no fim jogava a compilação inteira fora).
      - name: Guardar o motor no cache
        if: always() && steps.motor.outputs.cache-hit != 'true' && hashFiles('motor-slackware/usr/lib/jangada/motor/VERSAO') != ''
        uses: actions/cache/save@v4
        with:
          path: motor-slackware
          key: motor-slackware-${{ hashFiles('ci/motor-slackware.sh') }}

      - name: Pôr o pacote na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Num push no master: a release da versão do Cargo.toml.
          [ -n "$TAG" ] || TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "release: $TAG"
          # A release é criada pelo outro workflow: espera ela existir.
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 60; done
          gh release upload "$TAG" pacotes/*.tgz --clobber
