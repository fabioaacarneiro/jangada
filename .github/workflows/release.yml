# A cada tag v*: compila a Jangada no Debian trixie (a base do Glove OS), gera o .deb e o
# publica na release da versão. O repositório apt do Glove OS pega o pacote daqui.
name: Pacote da Jangada

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Conferir a versão com a tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Cargo.toml diz $v, mas a tag é $GITHUB_REF_NAME"; exit 1; }

      - name: Compilar e empacotar (Debian trixie)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie sh -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build \
              ca-certificates curl git dpkg-dev binutils xz-utils fontconfig fonts-dejavu-core \
              libudev-dev libxkbcommon-dev libwayland-dev \
              libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcomposite1 libxdamage1 \
              libxrandr2 libxext6 libxfixes3 libx11-6 libxcb1 libgbm1 libdrm2 libpango-1.0-0 libcairo2 \
              libasound2t64 libdbus-1-3 libexpat1 libudev1 libglib2.0-0t64
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            ./empacotar.sh
            ls -l pacotes/'

      - uses: actions/upload-artifact@v4
        with:
          name: jangada
          path: pacotes/*.deb
          retention-days: 7

      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas=$(git log -1 --format=%B | grep -v '^Co-Authored-By:' || true)
          gh release create "$GITHUB_REF_NAME" pacotes/*.deb --title "Jangada ${GITHUB_REF_NAME#v}" --notes "$notas" \
            || gh release upload "$GITHUB_REF_NAME" pacotes/*.deb --clobber
