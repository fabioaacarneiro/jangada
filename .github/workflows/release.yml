# A cada tag v*: compila a Jangada em cada distribuição (cada uma no seu contêiner) e
# publica os pacotes na release: .deb (Debian, Ubuntu e Glove OS), .rpm (Fedora), o pacote
# do Arch (.pkg.tar.zst) e o .tgz do Slackware. Cada pacote é instalado e conferido ali
# mesmo (ci/*.sh): os programas têm de achar todas as bibliotecas.
name: Pacotes da Jangada

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: deb (Debian trixie)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Conferir a versão com a tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Cargo.toml diz $v, mas a tag é $GITHUB_REF_NAME"; exit 1; }

      - name: Compilar, empacotar e conferir (Debian trixie)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie sh -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends build-essential pkg-config \
              ca-certificates curl git dpkg-dev binutils xz-utils fontconfig fonts-dejavu-core \
              libudev-dev libxkbcommon-dev libwebkitgtk-6.0-dev libgtk-4-dev
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            ./empacotar.sh
            ls -l pacotes/
            # O apt instala as dependências do pacote (WebKitGTK, GTK 4, GStreamer): confere.
            apt-get install -y ./pacotes/*.deb
            . ci/comum.sh
            conferir'

      - name: Instalar no Ubuntu 24.04 (o pacote serve também nele)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:24.04 sh -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ./pacotes/*.deb
            . ci/comum.sh
            conferir'

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-deb
          path: pacotes/*.deb
          if-no-files-found: error
          retention-days: 7

  distros:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Uma distribuição que falha não derruba as outras.
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            imagem: fedora:44
            arquivos: pacotes/*.rpm
          - distro: arch
            imagem: archlinux:latest
            arquivos: pacotes/*.pkg.tar.zst
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Compilar, empacotar e conferir (${{ matrix.imagem }})
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.imagem }} sh ci/${{ matrix.distro }}.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.distro }}
          path: ${{ matrix.arquivos }}
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Publicar na release
    needs: [deb, distros]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: pacote-*
          path: baixados
          merge-multiple: true

      - name: Publicar os pacotes na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas=$(git log -1 --format=%B | grep -v '^Co-Authored-By:' || true)
          gh release create "$GITHUB_REF_NAME" baixados/* --title "Jangada ${GITHUB_REF_NAME#v}" --notes "$notas" \
            || gh release upload "$GITHUB_REF_NAME" baixados/* --clobber
