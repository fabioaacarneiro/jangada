[package]
name = "jangada"
# Jangada, o navegador do Glove OS: o motor do Chromium (CEF) desenhando a página dentro
# de uma janela do glove-ui (o kit gráfico do Glove, submódulo ui/).
version = "1.2.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Jangada: o navegador do Glove OS (motor do Chromium, janela do Glove)"
repository = "https://github.com/fabioaacarneiro/jangada"

[[bin]]
name = "jangada"
path = "src/main.rs"

[dependencies]
cef = "=156.7.0"
glove-ui = { path = "ui/crates/ui" }
glove-config = { path = "ui/crates/config" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
