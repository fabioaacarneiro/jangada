[package]
name = "jangada"
# Jangada, o navegador do Glove OS: o motor do WebKitGTK (o do sistema, atualizado pela
# distribuição) dentro de uma janela do glove-ui (o kit gráfico do Glove, submódulo ui/).
version = "1.15.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Jangada: o navegador do Glove OS (motor WebKitGTK, janela do Glove)"
repository = "https://github.com/fabioaacarneiro/jangada"

[[bin]]
name = "jangada"
path = "src/main.rs"

[dependencies]
# O motor: o WebKitGTK 6.0 (GTK 4), o da distribuição.
webkit6 = "0.6"
glove-ui = { path = "ui/crates/ui", features = ["gtk"] }
glove-config = { path = "ui/crates/config" }
# O motor de bloqueio do Brave (EasyList, EasyPrivacy, filtros cosméticos).
# O chaveiro do sistema (Secret Service): as senhas guardadas e a chave do Chrome.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Importar de outros navegadores: favoritos (JSON), histórico, cookies e senhas (SQLite,
# cifrados com AES-128-CBC e a chave do chaveiro).
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
# O motor de bloqueio do Brave lê as listas (EasyList etc.) e as converte para os filtros
# nativos do WebKit (o formato do Safari: barrados pelo próprio motor, sem script na página).
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
